# Rebuilds data/foods.json with the Ministry of Health "צמרת" food composition data.
# Run manually: Actions → update-foods → Run workflow.
name: update-foods

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XLSX reader
        run: pip install openpyxl==3.1.5

      - name: Build food database (curated + label + Tzameret)
        run: python tools/build_foods.py --tzameret

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/foods.json; then
            echo "foods.json unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/foods.json data/foods-meta.json
          git commit -m "Update food database from Tzameret"
          git push
