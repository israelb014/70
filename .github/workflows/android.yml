# Android app: on every push to main — run the web tests, build the web assets, sign a release APK with the
# app's one release key, and publish it as GitHub Release "v{version}" (asset "70-v{version}.apk").
# The key is android/keystore.enc (AES-256), decrypted with the KEYSTORE_PASSWORD repository secret.
# Every release is signed with the same key, so each APK installs over the previous one.
name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the visual-parity test renders v2.3.0 from history

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Web tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm test
        env:
          TEST_JOBS: '3'

      - name: Build web assets + sync the Android project
        run: |
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Decrypt the release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The KEYSTORE_PASSWORD secret is missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/keystore.enc -out "$RUNNER_TEMP/seventy.keystore" -pass env:KEYSTORE_PASSWORD
          echo "KEYSTORE_FILE=$RUNNER_TEMP/seventy.keystore" >> "$GITHUB_ENV"

      - name: Android lint + signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease assembleRelease

      - name: Check the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -3

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          APK="70-v$V.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$APK" --clobber
          else
            gh release create "v$V" "$APK" --title "70 v$V" --latest \
              --notes "גרסה $V של האפליקציה. להתקנה: להוריד את $APK בטלפון ולפתוח אותו."
          fi
          rm -f "$RUNNER_TEMP/seventy.keystore"
